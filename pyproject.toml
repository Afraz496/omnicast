[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "omnicast"
version = "0.1.3"
description = "The definitive automatic forecasting library for Python -- one consistent, interval-aware API over every model"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Afraz Arif Khan"},
  {name = "Javier Martínez-Rodríguez"},
]
keywords = ["forecasting", "time-series", "arima", "ets"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "matplotlib>=3.10.9",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "seaborn>=0.13.2",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
torch = ["torch>=2.0"]
timesfm = ["timesfm>=3.0", "torch>=2.0"]
all = ["torch>=2.0", "timesfm>=3.0"]
docs = [
    "furo>=2025.12.19",
    "myst-nb>=1.1",
    "sphinx>=8.1.3",
    "sphinx-autodoc-typehints>=3.0.1",
]


[project.urls]
Repository = "https://github.com/Afraz496/omnicast"
Documentation = "https://afraz496.github.io/omnicast/"

[tool.hatch.build.targets.wheel]
packages = ["src/omnicast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
